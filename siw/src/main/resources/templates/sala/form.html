<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(${sala.id == null ? 'Nuova Sala' : 'Modifica Sala'})}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="main-content container">
        <div class="form-card">
            <div class="form-header">
                <span class="badge badge-admin" style="margin-bottom: 0.5rem;">Gestione Sale</span>
                <h1 class="form-title" th:text="${sala.id == null ? 'Inserisci Nuova Sala' : 'Modifica Sala'}">Nuova Sala</h1>
                <p class="form-subtitle">Compila le informazioni relative alla sala cinematografica</p>
            </div>

            <form th:action="@{/sale/salva}" th:object="${sala}" method="post">
                <input type="hidden" th:field="*{id}">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" style="margin-bottom: 1.5rem;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="nome">Nome della Sala *</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control" placeholder="Es. Sala Grande" required>
                    <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="indirizzo">Indirizzo Completo *</label>
                    <input type="text" id="indirizzo" th:field="*{indirizzo}" class="form-control" placeholder="Es. Lungomare Marconi 1, Venezia Lido" required>
                    <span th:if="${#fields.hasErrors('indirizzo')}" th:errors="*{indirizzo}" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="capienza">Capienza (Posti a Sedere) *</label>
                    <input type="number" id="capienza" th:field="*{capienza}" class="form-control" placeholder="Es. 450" min="1" required>
                    <span th:if="${#fields.hasErrors('capienza')}" th:errors="*{capienza}" class="form-error"></span>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        <i class="fa-solid fa-floppy-disk"></i> Salva Sala
                    </button>
                    <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Annulla</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
