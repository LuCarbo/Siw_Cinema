<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Calendario Proiezioni')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="main-content container">
        
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
            <div>
                <h1 class="section-title">Calendario Proiezioni</h1>
                <p style="color: var(--text-secondary); margin-top: 0.25rem;">
                    Tutte le proiezioni programmate nei festival e nelle sale
                    <span th:if="${proiezioni != null and !proiezioni.isEmpty()}" th:text="'(' + ${proiezioni.size()} + ' trovate)'"></span>
                </p>
            </div>
            <div th:if="${isAdmin}">
                <a th:href="@{/proiezioni/nuova}" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Nuova Proiezione
                </a>
            </div>
        </div>

        <!-- Filtri Proiezioni -->
        <div class="filter-box">
            <form th:action="@{/proiezioni}" method="get" style="display: flex; gap: 0.85rem; flex-wrap: wrap; align-items: center;">
                <input type="date" name="data" th:value="${selectedData}" class="form-control" style="flex: 1; min-width: 140px;" title="Filtra per data">

                <select name="festivalId" class="form-control" style="flex: 1.5; min-width: 170px;">
                    <option value="">-- Tutti i Festival --</option>
                    <option th:each="fest : ${festivals}" 
                            th:value="${fest.id}" 
                            th:text="${fest.nome + ' (' + fest.anno + ')'}"
                            th:selected="${selectedFestivalId == fest.id}">
                    </option>
                </select>

                <select name="filmId" class="form-control" style="flex: 1.5; min-width: 170px;">
                    <option value="">-- Tutti i Film --</option>
                    <option th:each="f : ${films}" 
                            th:value="${f.id}" 
                            th:text="${f.titolo}"
                            th:selected="${selectedFilmId == f.id}">
                    </option>
                </select>

                <select name="salaId" class="form-control" style="flex: 1.2; min-width: 140px;">
                    <option value="">-- Tutte le Sale --</option>
                    <option th:each="s : ${sale}" 
                            th:value="${s.id}" 
                            th:text="${s.nome}"
                            th:selected="${selectedSalaId == s.id}">
                    </option>
                </select>

                <button type="submit" class="btn btn-secondary">
                    <i class="fa-solid fa-filter"></i> Filtra
                </button>
                <a th:href="@{/proiezioni}" class="btn btn-outline" th:if="${selectedFestivalId != null or selectedFilmId != null or selectedSalaId != null or selectedData != null}">
                    <i class="fa-solid fa-xmark"></i> Reset
                </a>
            </form>
        </div>

        <!-- Lista Proiezioni -->
        <div th:if="${!proiezioni.isEmpty()}">
            <div th:each="p : ${proiezioni}" class="projection-item">
                <div class="proj-time">
                    <span class="proj-date" th:text="${p.data}">2026-08-28</span>
                    <span class="proj-hour" th:text="${p.ora}">20:30</span>
                </div>
                <div class="proj-details">
                    <h4 class="proj-film">
                        <a th:href="@{'/film/' + ${p.film.id}}" th:text="${p.film.titolo}">Titolo Film</a>
                    </h4>
                    <div class="proj-meta">
                        <span><i class="fa-solid fa-trophy" style="color: var(--accent-primary);"></i> <a th:href="@{'/festival/' + ${p.festival.id}}" th:text="${p.festival.nome}" style="color: var(--text-muted);">Festival</a></span>
                        <span><i class="fa-solid fa-couch" style="color: var(--accent-primary);"></i> <span th:text="${p.sala.nome + ' (' + p.sala.indirizzo + ')'}" style="color: var(--text-muted);">Sala</span></span>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <span class="badge badge-scheduled" th:if="${p.stato.name() == 'SCHEDULED'}" th:text="${p.stato.label}">Programmata</span>
                    <span class="badge badge-completed" th:if="${p.stato.name() == 'COMPLETED'}" th:text="${p.stato.label}">Completata</span>
                    <span class="badge badge-cancelled" th:if="${p.stato.name() == 'CANCELLED'}" th:text="${p.stato.label}">Annullata</span>
                    
                    <a th:href="@{'/proiezione/' + ${p.id}}" class="btn btn-sm btn-secondary">Dettagli</a>

                    <th:block th:if="${isAdmin}">
                        <a th:href="@{'/proiezioni/modifica/' + ${p.id}}" class="btn btn-sm btn-secondary" title="Modifica"><i class="fa-solid fa-pen"></i></a>
                        <a th:href="@{'/proiezioni/elimina/' + ${p.id}}" onclick="return confirm('Eliminare questa proiezione?');" class="btn btn-sm btn-danger" title="Elimina"><i class="fa-solid fa-trash"></i></a>
                    </th:block>
                </div>
            </div>
        </div>

        <div th:if="${proiezioni.isEmpty()}" style="text-align: center; padding: 4rem 0;">
            <i class="fa-regular fa-calendar-xmark" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
            <h3>Nessuna proiezione trovata</h3>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Non ci sono proiezioni con i filtri selezionati.</p>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
