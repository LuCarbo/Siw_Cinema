<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(${proiezione.id == null ? 'Nuova Proiezione' : 'Modifica Proiezione'})}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="main-content container">
        <div class="form-card">
            <div class="form-header">
                <span class="badge badge-admin" style="margin-bottom: 0.5rem;">Gestione Proiezioni</span>
                <h1 class="form-title" th:text="${proiezione.id == null ? 'Programma Nuova Proiezione' : 'Modifica Proiezione'}">Nuova Proiezione</h1>
                <p class="form-subtitle">Imposta festival, film, sala, data e orario della proiezione</p>
            </div>

            <form th:action="@{/proiezioni/salva}" th:object="${proiezione}" method="post">
                <input type="hidden" th:field="*{id}">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" style="margin-bottom: 1.5rem;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
                </div>

                <!-- Festival -->
                <div class="form-group">
                    <label class="form-label" for="festivalId">Festival di Appartenenza *</label>
                    <select id="festivalId" name="festivalId" class="form-control" required>
                        <option value="">-- Seleziona il Festival --</option>
                        <option th:each="fest : ${festivals}" 
                                th:value="${fest.id}" 
                                th:text="${fest.nome + ' (' + fest.anno + ') &bull; ' + fest.dataInizio + ' / ' + fest.dataFine}"
                                th:selected="${proiezione.festival != null and proiezione.festival.id == fest.id}">
                        </option>
                    </select>
                </div>

                <!-- Film -->
                <div class="form-group">
                    <label class="form-label" for="filmId">Film da Proiettare *</label>
                    <select id="filmId" name="filmId" class="form-control" required>
                        <option value="">-- Seleziona il Film --</option>
                        <option th:each="f : ${films}" 
                                th:value="${f.id}" 
                                th:text="${f.titolo + ' (' + f.anno + ' &bull; ' + f.durata + ' min)'}"
                                th:selected="${proiezione.film != null and proiezione.film.id == f.id}">
                        </option>
                    </select>
                </div>

                <!-- Sala -->
                <div class="form-group">
                    <label class="form-label" for="salaId">Sala Cinematografica *</label>
                    <select id="salaId" name="salaId" class="form-control" required>
                        <option value="">-- Seleziona la Sala --</option>
                        <option th:each="s : ${sale}" 
                                th:value="${s.id}" 
                                th:text="${s.nome + ' (' + s.indirizzo + ' &bull; Capienza: ' + s.capienza + ')'}"
                                th:selected="${proiezione.sala != null and proiezione.sala.id == s.id}">
                        </option>
                    </select>
                </div>

                <!-- Data & Ora -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="data">Data Proiezione *</label>
                        <input type="date" id="data" th:field="*{data}" class="form-control" required>
                        <span th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="form-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="ora">Ora Proiezione (HH:mm) *</label>
                        <input type="time" id="ora" th:field="*{ora}" class="form-control" required>
                        <span th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}" class="form-error"></span>
                    </div>
                </div>

                <!-- Stato -->
                <div class="form-group">
                    <label class="form-label" for="stato">Stato della Proiezione *</label>
                    <select id="stato" th:field="*{stato}" class="form-control" required>
                        <option th:each="st : ${stati}" 
                                th:value="${st}" 
                                th:text="${st.label}">
                        </option>
                    </select>
                    <span th:if="${#fields.hasErrors('stato')}" th:errors="*{stato}" class="form-error"></span>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        <i class="fa-solid fa-floppy-disk"></i> Salva Proiezione
                    </button>
                    <a th:href="@{/proiezioni}" class="btn btn-secondary">Annulla</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
