<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Esplora con React')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="main-content container">
        
        <!-- Punto di montaggio dell'applicazione React -->
        <div id="react-root"></div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

    <!-- Caricamento React 18 e Babel tramite CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Componente React integrato direttamente nell'HTML -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function FestivalExplorer() {
            const [festivals, setFestivals] = useState([]);
            const [selectedFestivalId, setSelectedFestivalId] = useState('');
            const [movies, setMovies] = useState([]);
            const [loadingFestivals, setLoadingFestivals] = useState(true);
            const [loadingMovies, setLoadingMovies] = useState(false);

            // 1. Chiamata REST iniziale per ottenere l'elenco dei festival
            useEffect(() => {
                fetch('/api/festivals')
                    .then(response => response.json())
                    .then(data => {
                        setFestivals(data);
                        if (data && data.length > 0) {
                            setSelectedFestivalId(data[0].id);
                        }
                        setLoadingFestivals(false);
                    })
                    .catch(error => {
                        console.error('Errore nel recupero dei festival:', error);
                        setLoadingFestivals(false);
                    });
            }, []);

            // 2. Chiamata REST per ottenere i film del festival selezionato
            useEffect(() => {
                if (!selectedFestivalId) return;

                setLoadingMovies(true);
                fetch('/api/festivals/' + selectedFestivalId + '/movies')
                    .then(response => response.json())
                    .then(data => {
                        setMovies(data);
                        setLoadingMovies(false);
                    })
                    .catch(error => {
                        console.error('Errore nel recupero dei film:', error);
                        setLoadingMovies(false);
                    });
            }, [selectedFestivalId]);

            const selectedFestival = festivals.find(f => f.id === Number(selectedFestivalId));

            if (loadingFestivals) {
                return (
                    <div style={{ textAlign: 'center', padding: '3rem 0' }}>
                        <i className="fa-solid fa-spinner fa-spin" style={{ fontSize: '2.5rem', color: 'var(--accent-gold)' }}></i>
                        <p style={{ marginTop: '1rem', color: 'var(--text-secondary)' }}>Caricamento festival da REST API...</p>
                    </div>
                );
            }

            return (
                <div style={{ maxWidth: '900px', margin: '0 auto' }}>
                    
                    {/* Header della sezione React */}
                    <div style={{ background: 'var(--bg-card)', padding: '2rem', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-color)', marginBottom: '2rem' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.5rem' }}>
                            <span className="badge badge-admin" style={{ background: 'rgba(97, 218, 251, 0.15)', color: '#61dafb', borderColor: '#61dafb' }}>
                                <i className="fa-brands fa-react"></i> Componente React
                            </span>
                            <span className="badge badge-user">REST API: /api/festivals</span>
                        </div>
                        <h1 style={{ fontSize: '1.75rem', margin: '0.5rem 0' }}>Esploratore Film per Festival</h1>
                        <p style={{ color: 'var(--text-secondary)', margin: 0, fontSize: '0.95rem' }}>
                            Seleziona un festival per visualizzare in tempo reale i film partecipanti consumando l'endpoint REST.
                        </p>

                        {/* Selettore Festival */}
                        <div style={{ marginTop: '1.5rem' }}>
                            <label style={{ display: 'block', fontSize: '0.9rem', color: 'var(--text-muted)', marginBottom: '0.5rem' }}>
                                Scegli il Festival:
                            </label>
                            <select 
                                className="form-control"
                                value={selectedFestivalId}
                                onChange={(e) => setSelectedFestivalId(e.target.value)}
                                style={{ fontSize: '1rem', fontWeight: 600 }}
                            >
                                {festivals.map(f => (
                                    <option key={f.id} value={f.id}>
                                        {f.nome} ({f.anno} - {f.citta})
                                    </option>
                                ))}
                            </select>
                        </div>
                    </div>

                    {/* Dettaglio Festival Selezionato */}
                    {selectedFestival && (
                        <div style={{ background: 'rgba(245, 158, 11, 0.08)', padding: '1.25rem 1.5rem', borderRadius: 'var(--radius-md)', border: '1px solid rgba(245, 158, 11, 0.3)', marginBottom: '2rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>
                            <div>
                                <h3 style={{ margin: 0, fontSize: '1.25rem', color: 'var(--accent-gold)' }}>{selectedFestival.nome}</h3>
                                <p style={{ margin: '0.25rem 0 0 0', color: 'var(--text-secondary)', fontSize: '0.85rem' }}>
                                    <i className="fa-solid fa-location-dot"></i> {selectedFestival.citta} &bull; {selectedFestival.dataInizio} - {selectedFestival.dataFine}
                                </p>
                            </div>
                            <span className="badge badge-user" style={{ fontSize: '0.9rem' }}>
                                {movies.length} Film Presenti
                            </span>
                        </div>
                    )}

                    {/* Lista Film Caricati via REST */}
                    {loadingMovies ? (
                        <div style={{ textAlign: 'center', padding: '2rem' }}>
                            <i className="fa-solid fa-spinner fa-spin" style={{ fontSize: '2rem', color: 'var(--accent-gold)' }}></i>
                            <p style={{ marginTop: '0.5rem', color: 'var(--text-secondary)' }}>Caricamento film del festival...</p>
                        </div>
                    ) : movies.length > 0 ? (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                            {movies.map(movie => (
                                <div key={movie.id} style={{ background: 'var(--bg-card)', padding: '1.25rem 1.5rem', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '1rem' }}>
                                    <div>
                                        <h4 style={{ margin: '0 0 0.25rem 0', fontSize: '1.15rem' }}>
                                            <a href={`/film/${movie.id}`} style={{ color: 'var(--text-primary)' }}>{movie.titolo}</a>
                                        </h4>
                                        <p style={{ margin: 0, fontSize: '0.85rem', color: 'var(--text-secondary)' }}>
                                            <span>{movie.anno}</span> &bull; 
                                            <span> {movie.genere}</span> &bull; 
                                            <span> {movie.durata} min</span> &bull; 
                                            <span> Regia: <strong style={{ color: 'var(--text-primary)' }}>{movie.nomeRegista || 'N/D'}</strong></span>
                                        </p>
                                    </div>
                                    <a href={`/film/${movie.id}`} className="btn btn-sm btn-outline">
                                        Scheda Film <i className="fa-solid fa-chevron-right"></i>
                                    </a>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div style={{ textAlign: 'center', padding: '3rem', background: 'var(--bg-card)', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-color)' }}>
                            <p style={{ color: 'var(--text-secondary)', margin: 0 }}>Nessun film assegnato a questa edizione del festival.</p>
                        </div>
                    )}

                </div>
            );
        }

        // Montaggio dell'applicazione React
        const root = ReactDOM.createRoot(document.getElementById('react-root'));
        root.render(<FestivalExplorer />);
    </script>

</body>
</html>
