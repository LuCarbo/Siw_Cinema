<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Registrazione')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="main-content container">
        <div class="form-card">
            <div class="form-header">
                <div style="font-size: 2.5rem; color: var(--accent-gold); margin-bottom: 0.5rem;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="form-title">Crea un Account</h1>
                <p class="form-subtitle">Unisciti alla community di cinefili per recensire i film</p>
            </div>

            <form th:action="@{/register}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="nome">Nome</label>
                        <input type="text" id="nome" th:field="${utente.nome}" class="form-control" placeholder="Es. Mario" required>
                        <span th:if="${#fields.hasErrors('utente.nome')}" th:errors="${utente.nome}" class="form-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="cognome">Cognome</label>
                        <input type="text" id="cognome" th:field="${utente.cognome}" class="form-control" placeholder="Es. Rossi" required>
                        <span th:if="${#fields.hasErrors('utente.cognome')}" th:errors="${utente.cognome}" class="form-error"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" th:field="${utente.email}" class="form-control" placeholder="Es. mario.rossi@email.it" required>
                    <span th:if="${#fields.hasErrors('utente.email')}" th:errors="${utente.email}" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" th:field="${credentials.username}" class="form-control" placeholder="Scegli un username univoco" required>
                    <span th:if="${#fields.hasErrors('credentials.username')}" th:errors="${credentials.username}" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" th:field="${credentials.password}" class="form-control" placeholder="Minimo 4 caratteri" required>
                    <span th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}" class="form-error"></span>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    <i class="fa-solid fa-check"></i> Completa Registrazione
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                Hai già un account? 
                <a th:href="@{/login}" style="color: var(--accent-gold); font-weight: 600;">Accedi</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
