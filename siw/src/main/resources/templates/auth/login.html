<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Accedi')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="main-content container">
        <div class="form-card">
            <div class="form-header">
                <div style="font-size: 2.25rem; color: var(--accent-primary); margin-bottom: 0.5rem;">
                    <i class="fa-solid fa-film"></i>
                </div>
                <h1 class="form-title">Accedi a SIW Cinema</h1>
                <p class="form-subtitle">Inserisci le tue credenziali per gestire recensioni e festival</p>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="Il tuo username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="La tua password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Accedi
                </button>
            </form>

            <!-- Google OAuth2 Login (disponibile se abilitato e configurato in .env) -->
            <th:block th:if="${googleAuthEnabled}">
                <div style="display: flex; align-items: center; margin: 1.5rem 0; text-align: center;">
                    <hr style="flex-grow: 1; border: none; border-top: 1px solid var(--border-color); margin: 0;">
                    <span style="padding: 0 0.75rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; font-weight: 500;">oppure</span>
                    <hr style="flex-grow: 1; border: none; border-top: 1px solid var(--border-color); margin: 0;">
                </div>

                <a th:href="@{/oauth2/authorization/google}" class="btn btn-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.75rem; border: 1px solid var(--border-color); background: rgba(255, 255, 255, 0.05); text-decoration: none; color: var(--text-primary); font-weight: 500; border-radius: var(--radius-sm); transition: all 0.2s ease;">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.98 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Accedi con Google</span>
                </a>
            </th:block>

            <div style="margin-top: 1.75rem; padding: 0.85rem 1rem; background: var(--accent-primary-light); border: 1px dashed var(--accent-primary-border); border-radius: var(--radius-sm); font-size: 0.825rem;">
                <p style="color: #c7d2fe; font-weight: 600; margin-bottom: 0.25rem;">
                    <i class="fa-solid fa-circle-info"></i> Account di Prova Predefiniti:
                </p>
                <p style="color: var(--text-muted);">
                    • <strong>Amministratore:</strong> <code>admin</code> / <code>admin</code><br>
                    • <strong>Utente Registrato:</strong> <code>mario</code> / <code>password</code>
                </p>
            </div>

            <div style="text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--text-muted);">
                Non hai ancora un account? 
                <a th:href="@{/register}" style="color: var(--accent-primary); font-weight: 600;">Registrati ora</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
