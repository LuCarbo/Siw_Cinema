<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(${regista.nomeCompleto})}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="main-content container">
        
        <div class="detail-banner" style="align-items: center; gap: 2.5rem;">
            <img th:src="${regista.foto != null ? regista.foto : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500'}" 
                 referrerpolicy="no-referrer"
                 alt="Foto Regista" style="width: 170px; height: 170px; border-radius: var(--radius-full); object-fit: cover; border: 3px solid var(--accent-primary); box-shadow: var(--shadow-lg);">
            
            <div class="detail-info">
                <span class="badge badge-admin" style="width: fit-content; margin-bottom: 0.5rem;">Regista</span>
                <h1 class="detail-title" th:text="${regista.nomeCompleto}">Nome Cognome</h1>
                <div class="detail-badges">
                    <span class="badge" style="background: var(--accent-primary-light); color: #c7d2fe; border: 1px solid var(--accent-primary-border);">
                        <i class="fa-solid fa-earth-americas"></i> <span th:text="${regista.nazionalita}" style="margin-left: 0.3rem;">Nazionalità</span>
                    </span>
                    <span class="badge" style="background: rgba(56,189,248,0.12); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.25);">
                        <i class="fa-solid fa-cake-candles"></i> <span th:text="'Nato il ' + ${#temporals.format(regista.dataNascita, 'dd/MM/yyyy')}" style="margin-left: 0.3rem;">Data</span>
                    </span>
                    <span class="badge" style="background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.25);">
                        <i class="fa-solid fa-clapperboard"></i> <span th:text="${regista.film.size() + ' Film in Catalogo'}" style="margin-left: 0.3rem;">0 Film</span>
                    </span>
                </div>

                <div th:if="${isAdmin}" style="display: flex; gap: 0.75rem; margin-top: 1rem;">
                    <a th:href="@{'/registi/modifica/' + ${regista.id}}" class="btn btn-sm btn-secondary">
                        <i class="fa-solid fa-pen"></i> Modifica Regista
                    </a>
                    <form th:action="@{'/registi/' + ${regista.id} + '/elimina'}" method="post" style="display: inline;"
                          onsubmit="return confirm('Sei sicuro di voler eliminare questo regista?');">
                        <button type="submit" class="btn btn-sm btn-danger">
                            <i class="fa-solid fa-trash"></i> Elimina Regista
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Filmografia del Regista -->
        <section class="section">
            <div class="section-header">
                <div>
                    <h2 class="section-title">Filmografia (<span th:text="${regista.film.size()}">0</span>)</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">Opere dirette da questo regista presenti nel sistema</p>
                </div>
                <div th:if="${isAdmin}">
                    <a th:href="@{/films/nuovo}" class="btn btn-sm btn-primary">
                        <i class="fa-solid fa-plus"></i> Aggiungi Nuovo Film
                    </a>
                </div>
            </div>

            <div class="cards-grid" th:if="${!regista.film.isEmpty()}">
                <div th:each="film : ${regista.film}" class="film-card">
                    <div class="film-poster">
                        <img th:src="${film.locandina != null ? film.locandina : 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600'}" 
                             alt="Locandina">
                        <div class="film-score">
                            <i class="fa-solid fa-star"></i>
                            <span th:text="${film.getMediaVoti() > 0 ? film.getMediaVoti() + ' / 5' : 'N/D'}">5.0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title" style="font-size: 1.15rem;">
                            <a th:href="@{'/film/' + ${film.id}}" th:text="${film.titolo}">Titolo Film</a>
                        </h3>
                        <div class="card-meta">
                            <span th:text="${film.anno}">2024</span> &bull; 
                            <span th:text="${film.genere}">Genere</span> &bull; 
                            <span th:text="${film.durata + ' min'}">120 min</span>
                        </div>
                        <a th:href="@{'/film/' + ${film.id}}" class="btn btn-sm btn-secondary" style="margin-top: 1rem; width: 100%;">
                            Scheda e Recensioni
                        </a>
                    </div>
                </div>
            </div>

            <div th:if="${regista.film.isEmpty()}" style="text-align: center; padding: 3rem 0; background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                <p style="color: var(--text-secondary);">Nessun film associato a questo regista.</p>
            </div>
        </section>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
