<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Catalogo Film')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="main-content container">
        
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
            <div>
                <h1 class="section-title">Catalogo Film</h1>
                <p style="color: var(--text-secondary); margin-top: 0.25rem;">Tutte le opere cinematografiche registrate nel sistema</p>
            </div>
            <div th:if="${isAdmin}">
                <a th:href="@{/films/nuovo}" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Nuovo Film
                </a>
            </div>
        </div>

        <!-- Filtri Film -->
        <div style="background: var(--bg-card); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 2.5rem;">
            <form th:action="@{/films}" method="get" style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <input type="text" name="titolo" th:value="${titolo}" placeholder="Cerca per titolo..." class="form-control" style="flex: 2; min-width: 200px;">
                <input type="text" name="genere" th:value="${genere}" placeholder="Filtra per genere (es. Drammatico, Fantascienza)..." class="form-control" style="flex: 1.5; min-width: 180px;">
                <input type="number" name="anno" th:value="${anno}" placeholder="Anno..." class="form-control" style="flex: 1; min-width: 110px;">
                <button type="submit" class="btn btn-secondary">
                    <i class="fa-solid fa-filter"></i> Filtra
                </button>
                <a th:href="@{/films}" class="btn btn-outline" th:if="${titolo != null or genere != null or anno != null}">Reset</a>
            </form>
        </div>

        <!-- Grid Film -->
        <div class="cards-grid" th:if="${!films.isEmpty()}">
            <div th:each="film : ${films}" class="film-card">
                <div class="film-poster">
                    <img th:src="${film.locandina != null ? film.locandina : 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600'}" 
                         alt="Locandina">
                    <div class="film-score">
                        <i class="fa-solid fa-star"></i>
                        <span th:text="${film.getMediaVoti() > 0 ? film.getMediaVoti() + ' / 5' : 'N/D'}">5.0</span>
                    </div>
                </div>
                <div class="card-body">
                    <h3 class="card-title" style="font-size: 1.15rem;">
                        <a th:href="@{'/film/' + ${film.id}}" th:text="${film.titolo}">Titolo Film</a>
                    </h3>
                    <div class="card-meta" style="margin-bottom: 0.75rem;">
                        <span th:text="${film.anno}">2024</span> &bull; 
                        <span th:text="${film.genere}">Genere</span> &bull; 
                        <span th:text="${film.durata + ' min'}">120 min</span>
                    </div>
                    <p th:if="${film.regista != null}" style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">
                        Regia: <a th:href="@{'/regista/' + ${film.regista.id}}" th:text="${film.regista.nomeCompleto}" style="color: var(--accent-gold); font-weight: 500;">Nome Regista</a>
                    </p>
                    <p th:unless="${film.regista != null}" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
                        Regia non specificata
                    </p>
                    <div class="card-footer">
                        <a th:href="@{'/film/' + ${film.id}}" class="btn btn-sm btn-secondary" style="flex: 1;">
                            Dettagli
                        </a>
                        <div th:if="${isAdmin}" style="display: flex; gap: 0.35rem; margin-left: 0.5rem;">
                            <a th:href="@{'/films/modifica/' + ${film.id}}" class="btn btn-sm btn-secondary" title="Modifica"><i class="fa-solid fa-pen"></i></a>
                            <a th:href="@{'/films/elimina/' + ${film.id}}" 
                               onclick="return confirm('Eliminare questo film? Verranno rimosse recensioni e proiezioni associate.');" 
                               class="btn btn-sm btn-danger" title="Elimina"><i class="fa-solid fa-trash"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${films.isEmpty()}" style="text-align: center; padding: 4rem 0;">
            <i class="fa-solid fa-clapperboard" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
            <h3>Nessun film trovato</h3>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Nessun film corrisponde ai criteri inseriti.</p>
        </div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
