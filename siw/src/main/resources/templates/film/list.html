<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Catalogo & Ricerca Film')}"></head>
<body>

    <header th:replace="~{fragments/base :: navbar}"></header>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="main-content container">
        
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
            <div>
                <h1 class="section-title">Catalogo & Ricerca Film</h1>
                <p style="color: var(--text-muted); margin-top: 0.25rem;">
                    Esplora e cerca i film in tempo reale tramite interfaccia reattiva React e REST API
                </p>
            </div>
            <div th:if="${isAdmin}">
                <a th:href="@{/films/nuovo}" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Nuovo Film
                </a>
            </div>
        </div>

        <!-- Punto di montaggio dell'applicazione React per ricerca e catalogo film -->
        <div id="react-film-search"></div>

    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

    <!-- Caricamento React 18 e Babel tramite CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Componente React per Ricerca e Visualizzazione Film -->
    <script type="text/babel" th:inline="none">
    /*<![CDATA[*/
        function FilmCatalogApp() {
            const [films, setFilms] = React.useState([]);
            const [titolo, setTitolo] = React.useState('');
            const [genere, setGenere] = React.useState('');
            const [regista, setRegista] = React.useState('');
            const [anno, setAnno] = React.useState('');
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                fetch('/api/movies')
                    .then(response => response.json())
                    .then(data => {
                        setFilms(data);
                        setLoading(false);
                    })
                    .catch(error => {
                        console.error('Errore nel recupero dei film:', error);
                        setLoading(false);
                    });
            }, []);

            const filteredFilms = films.filter(film => {
                const matchTitolo = !titolo || (film.titolo && film.titolo.toLowerCase().includes(titolo.toLowerCase().trim()));
                const matchGenere = !genere || (film.genere && film.genere.toLowerCase().includes(genere.toLowerCase().trim()));
                const dName = film.nomeRegista || film.registaNome;
                const matchRegista = !regista || (dName && dName.toLowerCase().includes(regista.toLowerCase().trim()));
                const matchAnno = !anno || (film.anno && film.anno.toString() === anno.toString().trim());
                return matchTitolo && matchGenere && matchRegista && matchAnno;
            });

            const uniqueGenres = Array.from(new Set(films.map(f => f.genere).filter(Boolean)));

            const handleReset = () => {
                setTitolo('');
                setGenere('');
                setRegista('');
                setAnno('');
            };

            const isFiltered = Boolean(titolo || genere || regista || anno);

            return (
                <div>
                    {/* Pannello Filtri */}
                    <div className="filter-box">
                        <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap', alignItems: 'flex-end' }}>
                            
                            <div style={{ flex: '2', minWidth: '180px' }}>
                                <label style={{ display: 'block', fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: '0.35rem', fontWeight: '500' }}>
                                    <i className="fa-solid fa-magnifying-glass" style={{ marginRight: '0.35rem', color: 'var(--accent-primary)' }}></i>Titolo
                                </label>
                                <input 
                                    type="text" 
                                    className="form-control" 
                                    placeholder="Cerca titolo..." 
                                    value={titolo}
                                    onChange={(e) => setTitolo(e.target.value)}
                                />
                            </div>

                            <div style={{ flex: '1.2', minWidth: '140px' }}>
                                <label style={{ display: 'block', fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: '0.35rem', fontWeight: '500' }}>
                                    <i className="fa-solid fa-masks-theater" style={{ marginRight: '0.35rem', color: 'var(--accent-primary)' }}></i>Genere
                                </label>
                                <select 
                                    className="form-control" 
                                    value={genere}
                                    onChange={(e) => setGenere(e.target.value)}
                                >
                                    <option value="">Tutti i generi</option>
                                    {uniqueGenres.map(g => (
                                        <option key={g} value={g}>{g}</option>
                                    ))}
                                </select>
                            </div>

                            <div style={{ flex: '1.5', minWidth: '160px' }}>
                                <label style={{ display: 'block', fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: '0.35rem', fontWeight: '500' }}>
                                    <i className="fa-solid fa-video" style={{ marginRight: '0.35rem', color: 'var(--accent-primary)' }}></i>Regista
                                </label>
                                <input 
                                    type="text" 
                                    className="form-control" 
                                    placeholder="Nome regista..." 
                                    value={regista}
                                    onChange={(e) => setRegista(e.target.value)}
                                />
                            </div>

                            <div style={{ flex: '0.8', minWidth: '100px' }}>
                                <label style={{ display: 'block', fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: '0.35rem', fontWeight: '500' }}>
                                    <i className="fa-regular fa-calendar" style={{ marginRight: '0.35rem', color: 'var(--accent-primary)' }}></i>Anno
                                </label>
                                <input 
                                    type="number" 
                                    className="form-control" 
                                    placeholder="Es. 2024" 
                                    value={anno}
                                    onChange={(e) => setAnno(e.target.value)}
                                />
                            </div>

                            {isFiltered && (
                                <div style={{ marginBottom: '2px' }}>
                                    <button 
                                        type="button" 
                                        onClick={handleReset} 
                                        className="btn btn-outline btn-sm"
                                        style={{ height: '38px' }}
                                    >
                                        <i className="fa-solid fa-xmark"></i> Reset
                                    </button>
                                </div>
                            )}

                        </div>

                        <div style={{ marginTop: '0.85rem', paddingTop: '0.75rem', borderTop: '1px solid var(--border-subtle)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <span style={{ fontSize: '0.825rem', color: 'var(--text-muted)' }}>
                                Risultati: <strong style={{ color: 'var(--accent-primary)' }}>{filteredFilms.length}</strong> film su {films.length}
                            </span>
                            <span className="badge" style={{ background: 'var(--accent-primary-light)', color: '#c7d2fe', border: '1px solid var(--accent-primary-border)', fontSize: '0.725rem' }}>
                                <i className="fa-brands fa-react" style={{ marginRight: '0.3rem' }}></i> Filtro Dinamico React
                            </span>
                        </div>
                    </div>

                    {/* Stato di Caricamento */}
                    {loading && (
                        <div style={{ textAlign: 'center', padding: '3.5rem 0' }}>
                            <i className="fa-solid fa-spinner fa-spin" style={{ fontSize: '2rem', color: 'var(--accent-primary)', marginBottom: '0.75rem' }}></i>
                            <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Caricamento catalogo...</p>
                        </div>
                    )}

                    {/* Griglia Film */}
                    {!loading && filteredFilms.length > 0 && (
                        <div className="cards-grid">
                            {filteredFilms.map(film => (
                                <div key={film.id} className="film-card">
                                    <div className="film-poster">
                                        <img 
                                            src={film.locandina ? film.locandina : 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600'} 
                                            alt={film.titolo} 
                                        />
                                        <div className="film-score">
                                            <i className="fa-solid fa-star"></i>
                                            <span>{film.mediaVoti > 0 ? film.mediaVoti + ' / 5' : 'N/D'}</span>
                                        </div>
                                    </div>
                                    <div className="card-body">
                                        <h3 className="card-title">
                                            <a href={'/film/' + film.id}>{film.titolo}</a>
                                        </h3>
                                        <div className="card-meta">
                                            <span>{film.anno}</span> &bull; 
                                            <span>{film.genere}</span> &bull; 
                                            <span>{film.durata} min</span>
                                        </div>
                                        <p style={{ fontSize: '0.825rem', color: 'var(--text-muted)', marginBottom: '0.85rem' }}>
                                            Regia: <strong style={{ color: 'var(--text-main)' }}>{film.nomeRegista || film.registaNome || 'N/D'}</strong>
                                        </p>
                                        <div className="card-footer">
                                            <a href={'/film/' + film.id} className="btn btn-sm btn-secondary" style={{ width: '100%' }}>
                                                Scheda & Recensioni
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Nessun Risultato */}
                    {!loading && filteredFilms.length === 0 && (
                        <div style={{ textAlign: 'center', padding: '3.5rem 0', background: 'var(--bg-card)', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-subtle)' }}>
                            <i className="fa-solid fa-film" style={{ fontSize: '2.5rem', color: 'var(--text-dim)', marginBottom: '0.5rem' }}></i>
                            <h3>Nessun film trovato</h3>
                            <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginTop: '0.25rem' }}>
                                Nessun film corrisponde ai filtri selezionati.
                            </p>
                            {isFiltered && (
                                <button type="button" onClick={handleReset} className="btn btn-sm btn-primary" style={{ marginTop: '1rem' }}>
                                    Mostra tutti i film
                                </button>
                            )}
                        </div>
                    )}

                </div>
            );
        }

        const rootElement = document.getElementById('react-film-search');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<FilmCatalogApp />);
        }
    /*]]>*/
    </script>

</body>
</html>
